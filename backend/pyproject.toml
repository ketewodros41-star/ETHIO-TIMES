[project]
name = "ethiotimes-backend"
version = "0.1.0"
description = "ETHIOTIMES — Ethiopian News Intelligence Engine (backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.ruff.lint.per-file-ignores]
# Seed data contains long, human-readable descriptive strings.
"app/data/sources_seed.py" = ["E501"]
# Alembic migrations are largely generated; long DDL lines are fine.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
