name: 24/7 Cloud Keep-Alive & Health Ping

on:
  schedule:
    # Runs every 5 minutes to prevent Render free instance from sleeping
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ETHIOTIMES Render Backend
        run: |
          echo "Pinging ETHIOTIMES backend on Render..."
          ENDPOINT="https://ethiotimes-backend.onrender.com/api/v1/health"
          for i in 1 2 3; do
            echo "Attempt $i: pinging $ENDPOINT"
            if curl -sSf -m 60 "$ENDPOINT"; then
              echo "ETHIOTIMES backend is awake and healthy."
              exit 0
            fi
            echo "Attempt $i failed or timed out. Retrying in 10s..."
            sleep 10
          done
          echo "Warning: All 3 ping attempts failed or timed out."
          exit 0
